name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pdfform calls the poppler binaries. The tests skip themselves without
      # them, so this is what makes them actually run.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - if: runner.os == 'macOS'
        run: brew install poppler
      # No first-party Windows package, so this one is allowed to fail: the
      # tests then skip the poppler half instead of failing the build.
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install poppler --no-progress
      - run: pip install -e ".[dev]"
      # Tests that need the corpus skip themselves -- it cannot be downloaded in CI.
      - run: python -m pytest -q -rs
