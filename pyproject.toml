[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "koscript"
version = "0.1.0"
description = "A toolkit for writing Korean video scripts: clause-level line breaking, docx forms, Premiere XML, prompter PDFs"
requires-python = ">=3.9"
dependencies = []          # docx 묶음은 표준 라이브러리만 쓴다

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["koscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
